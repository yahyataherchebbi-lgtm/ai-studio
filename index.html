<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application</title>
  <style>
    /* Navigation fixe en bas de page */
    nav {
      display: flex;
      justify-content: space-around;
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #f1f1f1;
      padding: 10px 0;
      border-top: 1px solid #ccc;
    }
    nav div {
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="content">
    <!-- Contenu principal ici -->
  </div>
<div style="text-align:center; margin-top:30px;">
  <button onclick="chooseImage('image')" style="padding:15px 25px; font-size:16px; border-radius:12px;">
    📷 Importer une image
  </button>
</div>
  <nav>
    <div onclick="chooseImage('lift_up_clothes')">👗<br>Lift up clothes</div>
    <div onclick="chooseImage('undress')">👙<br>Undress</div>
    <div onclick="chooseImage('profil')">👤<br>Profil</div>
  </nav>

  <script>
function chooseImage(type) {

  if (type === 'image') {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';

    input.onchange = function(event) {
      const file = event.target.files[0];

      if (file) {
        const imageURL = URL.createObjectURL(file);

        const preview = document.createElement('img');
        preview.src = imageURL;

        preview.style.position = 'fixed';
        preview.style.top = '50%';
        preview.style.left = '50%';
        preview.style.transform = 'translate(-50%, -50%)';
        preview.style.maxWidth = '90%';
        preview.style.maxHeight = '80%';
        preview.style.zIndex = '9999';
        preview.style.borderRadius = '15px';
        preview.style.cursor = 'pointer';

        document.body.appendChild(preview);

        preview.onclick = function() {
          preview.remove();
          URL.revokeObjectURL(imageURL);
        };
      }
      
      // Nettoyage de l'élément input
      input.remove();
    };

    input.click();

  } else if (type === 'lift_up_clothes') {
    alert("Action sélectionnée : Soulever les vêtements (Lift up clothes)");

  } else if (type === 'hair_style') { // Correction de la condition vide
    alert("Action sélectionnée : Style cheveux (Hair style)");

  } else {
    alert("Fonction sélectionnée : " + type);
  }
}
</script>
